name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore InfraOrgIt.slnx
      - name: Build
        run: dotnet build InfraOrgIt.slnx --no-restore -warnaserror
      - name: Test
        run: dotnet test InfraOrgIt.slnx --no-build --verbosity normal
