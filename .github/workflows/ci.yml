name: backend-ci

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json
      - name: Restore
        run: dotnet restore InfraOrgIt.slnx
      - name: Build
        run: dotnet build InfraOrgIt.slnx --no-restore -warnaserror
      - name: Test
        run: dotnet test InfraOrgIt.slnx --no-build --verbosity normal
      - name: OpenAPI
        run: ./scripts/openapi.sh
      - name: OpenAPI drift
        run: git diff --exit-code -- openapi/InfraOrgIt.Api.json
